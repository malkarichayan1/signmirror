<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SignMirror — Reference Capture</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      gap: 1.5rem;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; color: #00e676; }
    .preview {
      position: relative;
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* mirror display; captured data stays raw */
      background: #111;
      border-radius: 10px;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    canvas { pointer-events: none; }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    input[type="text"] {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      width: 200px;
    }
    button {
      background: #00e676;
      color: #0f0f0f;
      border: none;
      padding: 0.65rem 1.4rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { background: #333; color: #666; cursor: default; }
    #status { font-size: 0.9rem; color: #888; min-height: 1.4em; text-align: center; }
    #status.ok  { color: #00e676; }
    #status.err { color: #ff5252; }
    .hint {
      font-size: 0.85rem;
      color: #555;
      text-align: center;
      max-width: 600px;
      line-height: 1.6;
    }
    code { background: #1a1a1a; padding: 0.1em 0.4em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>SignMirror — Reference Capture</h1>

  <div class="preview">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <input id="signId"   type="text" placeholder="sign id (e.g. hello)"       />
    <input id="signName" type="text" placeholder="display name (e.g. Hello)"  />
    <button id="captureBtn" disabled>Capture (Space)</button>
  </div>

  <div id="status">Loading MediaPipe…</div>

  <p class="hint">
    Hold the sign steady, then press <strong>Space</strong> or click Capture.<br>
    The JSON downloads automatically — place it in <code>src/data/signs/</code>
    and add it to <code>src/data/lessons.js</code>.
  </p>

  <script type="module">
    // Coordinate convention: landmarks are captured in RAW (unmirrored) camera
    // coordinates, exactly as MediaPipe outputs them. The display above is
    // CSS-mirrored so it feels like a mirror, but the numbers in the JSON are
    // raw. This matches the convention in src/lib/normalize.js and matcher.js.

    const WASM_CDN =
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
    const MODEL_URL =
      'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17],
    ];

    // Duplicated from src/lib/normalize.js to keep this file self-contained.
    function normalizeLandmarks(landmarks) {
      const wrist    = landmarks[0];
      const midMcp   = landmarks[9];
      const dx = midMcp.x - wrist.x;
      const dy = midMcp.y - wrist.y;
      const scale = Math.sqrt(dx * dx + dy * dy);
      if (scale < 1e-6) return null;
      return landmarks.map((lm) => ({
        x: +((lm.x - wrist.x) / scale).toFixed(6),
        y: +((lm.y - wrist.y) / scale).toFixed(6),
        z: +((lm.z - wrist.z) / scale).toFixed(6),
      }));
    }

    const video  = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const btn    = document.getElementById('captureBtn');
    const ctx    = canvas.getContext('2d');

    let handLandmarker  = null;
    let lastVideoTime   = -1;
    let latestLandmarks = null;

    function setStatus(msg, cls) {
      status.textContent = msg;
      status.className   = cls || '';
    }

    async function init() {
      try {
        const { HandLandmarker, FilesetResolver } = await import(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm'
        );
        const vision = await FilesetResolver.forVisionTasks(WASM_CDN);
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
          runningMode: 'VIDEO',
          numHands: 1,
        });

        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();

        btn.disabled = false;
        setStatus('Ready — hold a sign and press Space or Capture.', 'ok');
        requestAnimationFrame(detect);
      } catch (err) {
        setStatus('Error: ' + err.message, 'err');
        console.error(err);
      }
    }

    function detect() {
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = handLandmarker.detectForVideo(video, performance.now());
        latestLandmarks = results.landmarks[0] || null;
        draw(latestLandmarks);
      }
      requestAnimationFrame(detect);
    }

    function draw(lms) {
      const w = video.videoWidth;
      const h = video.videoHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      ctx.clearRect(0, 0, w, h);
      if (!lms) return;

      ctx.strokeStyle = '#00e676';
      ctx.lineWidth   = 2;
      for (const [a, b] of CONNECTIONS) {
        ctx.beginPath();
        ctx.moveTo(lms[a].x * w, lms[a].y * h);
        ctx.lineTo(lms[b].x * w, lms[b].y * h);
        ctx.stroke();
      }
      ctx.fillStyle = '#fff';
      for (const lm of lms) {
        ctx.beginPath();
        ctx.arc(lm.x * w, lm.y * h, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function capture() {
      if (!latestLandmarks) {
        setStatus('No hand detected — move closer to the camera.', 'err');
        return;
      }
      const id   = document.getElementById('signId').value.trim()   || 'unnamed';
      const name = document.getElementById('signName').value.trim() || id;

      const normalized = normalizeLandmarks(latestLandmarks);
      if (!normalized) {
        setStatus('Normalization failed — hand may be degenerate.', 'err');
        return;
      }

      const payload = { id, name, description: '', landmarks: normalized };
      const blob = new Blob(
        [JSON.stringify(payload, null, 2)],
        { type: 'application/json' }
      );
      const a = document.createElement('a');
      a.href     = URL.createObjectURL(blob);
      a.download = id + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus('Captured "' + name + '" -> ' + id + '.json downloaded.', 'ok');
    }

    btn.addEventListener('click', capture);
    window.addEventListener('keydown', function(e) {
      if (e.code === 'Space') { e.preventDefault(); capture(); }
    });

    init();
  </script>
</body>
</html>
